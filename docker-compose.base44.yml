services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    init: true
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 3000 --strictPort"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      # Use the existing hosted API; no production deployment is performed.
      VITE_BASE44_APP_ID: 6a837c8e995cc4824aabf594
      VITE_BASE44_APP_BASE_URL: https://app.base44.com
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS}
      CHOKIDAR_USEPOLLING: "true"
    env_file:
      - /run/base44/app.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5

volumes:
  web_node_modules:
