name: Fortress Ephemeral Validation

on:
  push:
    branches:
      - fortress/v1.1

permissions:
  contents: read

concurrency:
  group: fortress-ephemeral-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  ENGINE_API_KEY: fortress_ci_key_0123456789abcdef0123456789abcdef

jobs:
  source-gates:
    name: Source and Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Fortress core static/adversarial checks
        run: node ci/fortress-core-static.mjs

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Root dependency audit
        run: npm audit --audit-level=high

      - name: Browser engine syntax
        run: |
          node --check browser-engine/server.js
          node --check browser-engine/ssrf.js
          for f in browser-engine/engine/*.js; do node --check "$f"; done
          node --check ci/fortress-engine-smoke.mjs

      - name: Browser engine dependency audit
        working-directory: browser-engine
        run: |
          npm install --package-lock-only --ignore-scripts --omit=dev
          npm audit --audit-level=high --omit=dev

  container-smoke:
    name: Hardened Container and Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Fortress browser image
        run: docker build --pull -t cloudbrowser-fortress-ci ./browser-engine

      - name: Start isolated hardened container
        run: |
          docker run -d \
            --name fortress-engine \
            -p 127.0.0.1:8080:8080 \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=256m \
            --tmpfs /home/engine:rw,nosuid,size=64m \
            --tmpfs /data:rw,nosuid,size=64m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=256 \
            --memory=2g \
            --cpus=2 \
            -e ENGINE_API_KEY="$ENGINE_API_KEY" \
            -e CORS_ALLOWLIST="https://allowed.invalid" \
            -e POOL_SIZE=3 \
            -e MAX_SESSIONS=10 \
            -e DEFAULT_TIMEOUT=15000 \
            cloudbrowser-fortress-ci

      - name: Wait for engine liveness
        run: |
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/liveness >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs fortress-engine
          exit 1

      - name: Verify container runtime restrictions
        run: |
          UID_VALUE=$(docker exec fortress-engine id -u)
          test "$UID_VALUE" != "0"
          docker exec fortress-engine sh -c 'test -r /ms-playwright && test -d /tmp && test -w /tmp'
          READONLY=$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' fortress-engine)
          CAPDROP=$(docker inspect --format '{{json .HostConfig.CapDrop}}' fortress-engine)
          SECURITY=$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' fortress-engine)
          PIDS=$(docker inspect --format '{{.HostConfig.PidsLimit}}' fortress-engine)
          test "$READONLY" = "true"
          echo "$CAPDROP" | grep -q 'ALL'
          echo "$SECURITY" | grep -q 'no-new-privileges'
          test "$PIDS" = "256"
          echo "runtime_uid=$UID_VALUE readonly=$READONLY capdrop=$CAPDROP security=$SECURITY pids=$PIDS"

      - name: Execute black-box Fortress engine smoke suite
        run: node ci/fortress-engine-smoke.mjs

      - name: Verify graceful SIGTERM drain
        run: |
          docker stop -t 10 fortress-engine
          EXIT_CODE=$(docker inspect --format '{{.State.ExitCode}}' fortress-engine)
          test "$EXIT_CODE" = "0"
          echo "graceful_exit_code=$EXIT_CODE"

      - name: Container logs
        if: always()
        run: docker logs fortress-engine 2>&1 || true

  validation-status:
    name: Fortress Ephemeral Validation Status
    runs-on: ubuntu-latest
    needs:
      - source-gates
      - container-smoke
    if: always()
    steps:
      - name: Enforce all ephemeral gates
        run: |
          test "${{ needs.source-gates.result }}" = "success"
          test "${{ needs.container-smoke.result }}" = "success"
          echo "FORTRESS EPHEMERAL VALIDATION PASS"
