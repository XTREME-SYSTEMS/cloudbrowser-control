name: Fortress Enterprise Parallel

on:
  workflow_dispatch:
  push:
    branches:
      - fortress/v1.1
    paths-ignore:
      - docs/FORTRESS_*_RECEIPT.md

permissions:
  contents: read

concurrency:
  group: fortress-enterprise-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  ENGINE_API_KEY: fortress_ci_key_0123456789abcdef0123456789abcdef

jobs:
  source-contracts:
    name: Source Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Existing Fortress static suite
        run: node ci/fortress-core-static.mjs
      - name: Enterprise security contracts
        run: node ci/fortress-enterprise-contracts.mjs
      - name: Workflow integrity contracts
        run: node ci/fortress-workflow-contracts.mjs
      - name: SSRF adversarial unit vectors
        run: node ci/fortress-ssrf-adversarial.mjs

  code-quality:
    name: Build Lint Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - name: Browser engine syntax
        run: |
          node --check browser-engine/server.js
          node --check browser-engine/ssrf.js
          for f in browser-engine/engine/*.js; do node --check "$f"; done
          node --check ci/fortress-engine-smoke.mjs
          node --check ci/fortress-engine-soak.mjs
          node --check ci/fortress-enterprise-contracts.mjs
          node --check ci/fortress-workflow-contracts.mjs
          node --check ci/fortress-ssrf-adversarial.mjs

  supply-chain:
    name: Supply Chain High Critical Zero
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Root dependency audit
        run: npm audit --audit-level=high
      - name: Browser engine dependency audit
        working-directory: browser-engine
        run: |
          npm install --package-lock-only --ignore-scripts --omit=dev
          npm audit --audit-level=high --omit=dev

  container-smoke:
    name: Hardened Container Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build browser image
        run: docker build --pull -t cloudbrowser-fortress-enterprise ./browser-engine
      - name: Start hardened container
        run: |
          docker run -d --name fortress-engine -p 127.0.0.1:8080:8080 \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=256m \
            --tmpfs /home/engine:rw,nosuid,size=64m \
            --tmpfs /data:rw,nosuid,size=64m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=256 --memory=2g --cpus=2 \
            -e ENGINE_API_KEY="$ENGINE_API_KEY" \
            -e CORS_ALLOWLIST="https://allowed.invalid" \
            -e POOL_SIZE=3 -e MAX_SESSIONS=10 -e DEFAULT_TIMEOUT=15000 \
            cloudbrowser-fortress-enterprise
      - name: Wait for liveness
        run: |
          for i in $(seq 1 60); do curl --silent --fail http://127.0.0.1:8080/liveness >/dev/null && exit 0; sleep 2; done
          docker logs fortress-engine
          exit 1
      - name: Verify runtime restrictions
        run: |
          test "$(docker exec fortress-engine id -u)" != "0"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' fortress-engine)" = "true"
          docker inspect --format '{{json .HostConfig.CapDrop}}' fortress-engine | grep -q ALL
          docker inspect --format '{{json .HostConfig.SecurityOpt}}' fortress-engine | grep -q no-new-privileges
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' fortress-engine)" = "256"
      - name: Black-box smoke
        run: node ci/fortress-engine-smoke.mjs
      - name: Graceful drain
        run: |
          docker stop -t 10 fortress-engine
          test "$(docker inspect --format '{{.State.ExitCode}}' fortress-engine)" = "0"
      - name: Logs
        if: always()
        run: docker logs fortress-engine 2>&1 || true

  container-soak:
    name: Hardened Container Soak
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build browser image
        run: docker build --pull -t cloudbrowser-fortress-soak ./browser-engine
      - name: Start hardened container
        run: |
          docker run -d --name fortress-engine-soak -p 127.0.0.1:8080:8080 \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=256m \
            --tmpfs /home/engine:rw,nosuid,size=64m \
            --tmpfs /data:rw,nosuid,size=64m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=256 --memory=2g --cpus=2 \
            -e ENGINE_API_KEY="$ENGINE_API_KEY" \
            -e CORS_ALLOWLIST="https://allowed.invalid" \
            -e POOL_SIZE=3 -e MAX_SESSIONS=10 -e DEFAULT_TIMEOUT=20000 \
            cloudbrowser-fortress-soak
      - name: Wait for liveness
        run: |
          for i in $(seq 1 60); do curl --silent --fail http://127.0.0.1:8080/liveness >/dev/null && exit 0; sleep 2; done
          docker logs fortress-engine-soak
          exit 1
      - name: Lifecycle and concurrency soak
        run: node ci/fortress-engine-soak.mjs
      - name: Graceful drain after soak
        run: |
          docker stop -t 10 fortress-engine-soak
          test "$(docker inspect --format '{{.State.ExitCode}}' fortress-engine-soak)" = "0"
      - name: Logs
        if: always()
        run: docker logs fortress-engine-soak 2>&1 || true

  enterprise-gate:
    name: Fortress Enterprise Aggregate Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [source-contracts, code-quality, supply-chain, container-smoke, container-soak]
    permissions:
      contents: write
    steps:
      - name: Aggregate fail-closed
        id: aggregate
        run: |
          printf '%s\n' \
            "source-contracts=${{ needs.source-contracts.result }}" \
            "code-quality=${{ needs.code-quality.result }}" \
            "supply-chain=${{ needs.supply-chain.result }}" \
            "container-smoke=${{ needs.container-smoke.result }}" \
            "container-soak=${{ needs.container-soak.result }}"
          if [ "${{ needs.source-contracts.result }}" = success ] && \
             [ "${{ needs.code-quality.result }}" = success ] && \
             [ "${{ needs.supply-chain.result }}" = success ] && \
             [ "${{ needs.container-smoke.result }}" = success ] && \
             [ "${{ needs.container-soak.result }}" = success ]; then
            echo "overall=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "overall=FAIL" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fortress/v1.1
          fetch-depth: 0
          persist-credentials: true
      - name: Persist enterprise receipt
        run: |
          cat > docs/FORTRESS_ENTERPRISE_PARALLEL_RECEIPT.md <<EOF_RECEIPT
          # Fortress Enterprise Parallel Receipt

          - Tested commit: ${{ github.sha }}
          - Workflow run: ${{ github.run_id }}
          - Source contracts: ${{ needs.source-contracts.result }}
          - Code quality: ${{ needs.code-quality.result }}
          - Supply chain: ${{ needs.supply-chain.result }}
          - Hardened container smoke: ${{ needs.container-smoke.result }}
          - Hardened container soak: ${{ needs.container-soak.result }}
          - Overall: ${{ steps.aggregate.outputs.overall }}
          - Production deploy: NOT EXECUTED
          - Main write/merge: NOT EXECUTED
          - Base44 production mutation: NOT EXECUTED
          - DNS rebinding TOCTOU: NOT VERIFIED without network-layer/pinned-resolution evidence
          - Base44 Test Data live integration: NOT VERIFIED by this workflow
          - Railway staging: NOT VERIFIED by this workflow
          EOF_RECEIPT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FORTRESS_ENTERPRISE_PARALLEL_RECEIPT.md
          if ! git diff --cached --quiet; then
            git commit -m "ci: record Fortress enterprise parallel receipt"
            git pull --rebase origin fortress/v1.1
            git push origin HEAD:fortress/v1.1
          fi
      - name: Enforce aggregate
        run: test "${{ steps.aggregate.outputs.overall }}" = PASS
