name: Fortress Chromium Sandbox Probe

on:
  push:
    branches:
      - fortress/v1.1-chromium-sandbox-probe
    paths-ignore:
      - docs/FORTRESS_CHROMIUM_SANDBOX_PROBE_RECEIPT.md

permissions:
  contents: write

concurrency:
  group: fortress-chromium-sandbox-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  ENGINE_API_KEY: fortress_sandbox_ci_key_0123456789abcdef0123456789abcdef

jobs:
  sandbox-probe:
    name: Chromium Sandbox Probe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Remove no-sandbox flags in CI workspace only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('browser-engine/engine/runtime.js')
          s=p.read_text()
          s=s.replace('["--no-sandbox", "--disable-dev-shm-usage"]','["--disable-dev-shm-usage"]')
          s=s.replace('["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage"]','["--disable-dev-shm-usage"]')
          p.write_text(s)
          assert '--no-sandbox' not in s
          assert '--disable-setuid-sandbox' not in s
          PY
          node --check browser-engine/engine/runtime.js
      - name: Build sandbox-enabled browser image
        run: docker build --pull -t cloudbrowser-fortress-sandbox ./browser-engine
      - name: Start restricted container
        run: |
          docker run -d --name fortress-engine-sandbox -p 127.0.0.1:8080:8080 \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=256m \
            --tmpfs /home/engine:rw,nosuid,size=64m \
            --tmpfs /data:rw,nosuid,size=64m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=256 --memory=2g --cpus=2 \
            -e ENGINE_API_KEY="$ENGINE_API_KEY" \
            -e CORS_ALLOWLIST="https://allowed.invalid" \
            -e POOL_SIZE=3 -e MAX_SESSIONS=10 -e DEFAULT_TIMEOUT=15000 \
            cloudbrowser-fortress-sandbox
      - name: Require liveness
        run: |
          for i in $(seq 1 60); do curl --silent --fail http://127.0.0.1:8080/liveness >/dev/null && exit 0; sleep 2; done
          docker logs fortress-engine-sandbox
          exit 1
      - name: Require Chromium readiness without no-sandbox
        run: curl --silent --fail http://127.0.0.1:8080/readiness | tee /tmp/readiness.json | grep -q '"browser_launch":"verified"'
      - name: Require pool 3/3
        run: |
          for i in $(seq 1 60); do
            POOL=$(curl --silent --fail -H "x-api-key: $ENGINE_API_KEY" http://127.0.0.1:8080/pool || true)
            echo "$POOL"
            echo "$POOL" | grep -q '"warmCount":3' && exit 0
            sleep 2
          done
          docker logs fortress-engine-sandbox
          exit 1
      - name: Black-box smoke with Chromium sandbox enabled
        run: node ci/fortress-engine-smoke.mjs
      - name: Verify non-root and hard restrictions
        run: |
          test "$(docker exec fortress-engine-sandbox id -u)" != "0"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' fortress-engine-sandbox)" = "true"
          docker inspect --format '{{json .HostConfig.CapDrop}}' fortress-engine-sandbox | grep -q ALL
          docker inspect --format '{{json .HostConfig.SecurityOpt}}' fortress-engine-sandbox | grep -q no-new-privileges
      - name: Graceful drain
        run: |
          docker stop -t 10 fortress-engine-sandbox
          test "$(docker inspect --format '{{.State.ExitCode}}' fortress-engine-sandbox)" = "0"
      - name: Logs
        if: always()
        run: docker logs fortress-engine-sandbox 2>&1 || true

  receipt:
    name: Chromium Sandbox Probe Receipt
    runs-on: ubuntu-latest
    if: always()
    needs: [sandbox-probe]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fortress/v1.1-chromium-sandbox-probe
          fetch-depth: 0
      - name: Persist result
        run: |
          RESULT="${{ needs.sandbox-probe.result }}"
          cat > docs/FORTRESS_CHROMIUM_SANDBOX_PROBE_RECEIPT.md <<EOF_RECEIPT
          # Fortress Chromium Sandbox Probe Receipt

          - Tested commit: ${{ github.sha }}
          - Workflow run: ${{ github.run_id }}
          - Chromium sandbox probe: $RESULT
          - Probe source mutation: CI WORKSPACE ONLY, --no-sandbox flags removed before image build
          - Non-root runtime: REQUIRED
          - Read-only rootfs: REQUIRED
          - Capabilities dropped: REQUIRED
          - No-new-privileges: REQUIRED
          - Pool 3/3: REQUIRED
          - Browser smoke: REQUIRED
          - Production deploy: NOT EXECUTED
          - Main write/merge: NOT EXECUTED
          EOF_RECEIPT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FORTRESS_CHROMIUM_SANDBOX_PROBE_RECEIPT.md
          if ! git diff --cached --quiet; then
            git commit -m "ci: record Chromium sandbox probe receipt"
            git pull --rebase origin fortress/v1.1-chromium-sandbox-probe
            git push origin HEAD:fortress/v1.1-chromium-sandbox-probe
          fi
      - name: Fail if sandbox probe failed
        run: test "${{ needs.sandbox-probe.result }}" = success
