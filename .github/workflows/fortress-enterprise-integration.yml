name: Fortress Enterprise Integration

on:
  workflow_dispatch:
  push:
    branches:
      - fortress/v1.1-enterprise-integration
    paths-ignore:
      - docs/FORTRESS_ENTERPRISE_INTEGRATION_RECEIPT.md

permissions:
  contents: write

concurrency:
  group: fortress-enterprise-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  ENGINE_API_KEY: fortress_integration_ci_key_0123456789abcdef0123456789abcdef

jobs:
  security-contracts:
    name: Security Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Syntax and sandbox source invariant
        run: |
          node --check browser-engine/ssrf.js
          node --check browser-engine/egress-proxy.js
          node --check browser-engine/engine/config.js
          node --check browser-engine/engine/runtime.js
          node --check ci/fortress-pinned-egress.mjs
          node --check ci/fortress-capacity-contracts.mjs
          if grep -R --line-number --fixed-strings -- '--no-sandbox' browser-engine; then exit 1; fi
          if grep -R --line-number --fixed-strings -- '--disable-setuid-sandbox' browser-engine; then exit 1; fi
      - run: node ci/fortress-core-static.mjs
      - run: node ci/fortress-enterprise-contracts.mjs
      - run: node ci/fortress-ssrf-adversarial.mjs
      - run: node ci/fortress-pinned-egress.mjs
      - run: node ci/fortress-capacity-contracts.mjs

  quality-supply-chain:
    name: Quality And Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - name: Root audit HIGH/CRITICAL zero
        run: npm audit --audit-level=high
      - name: Browser engine audit HIGH/CRITICAL zero
        working-directory: browser-engine
        run: |
          npm install --package-lock-only --ignore-scripts --omit=dev
          npm audit --audit-level=high --omit=dev

  hardened-smoke:
    name: Hardened Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: docker build --pull -t cloudbrowser-fortress-integration ./browser-engine
      - name: Start hardened container
        run: |
          docker run -d --name fortress-integration -p 127.0.0.1:8080:8080 \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=256m \
            --tmpfs /home/engine:rw,nosuid,size=64m \
            --tmpfs /data:rw,nosuid,size=64m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=256 --memory=2g --cpus=2 \
            -e ENGINE_API_KEY="$ENGINE_API_KEY" \
            -e CORS_ALLOWLIST="https://allowed.invalid" \
            -e POOL_SIZE=3 -e MAX_SESSIONS=10 -e WARM_POOL_INSTANCE_BUDGET=4 \
            -e DEFAULT_TIMEOUT=20000 \
            cloudbrowser-fortress-integration
      - name: Require liveness
        run: |
          for i in $(seq 1 60); do curl --silent --fail http://127.0.0.1:8080/liveness >/dev/null && exit 0; sleep 2; done
          docker logs fortress-integration
          exit 1
      - name: Require Chromium readiness and pool 3/3
        run: |
          curl --silent --fail http://127.0.0.1:8080/readiness | tee /tmp/readiness.json | grep -q '"browser_launch":"verified"'
          for i in $(seq 1 60); do
            POOL=$(curl --silent --fail -H "x-api-key: $ENGINE_API_KEY" http://127.0.0.1:8080/pool || true)
            echo "$POOL"
            echo "$POOL" | grep -q '"warmCount":3' && exit 0
            sleep 2
          done
          exit 1
      - name: Runtime containment
        run: |
          test "$(docker exec fortress-integration id -u)" != "0"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' fortress-integration)" = "true"
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' fortress-integration)" = "256"
          docker inspect --format '{{json .HostConfig.CapDrop}}' fortress-integration | grep -q ALL
          docker inspect --format '{{json .HostConfig.SecurityOpt}}' fortress-integration | grep -q no-new-privileges
      - run: node ci/fortress-engine-smoke.mjs
      - name: Graceful drain
        run: |
          docker stop -t 10 fortress-integration
          test "$(docker inspect --format '{{.State.ExitCode}}' fortress-integration)" = "0"
      - name: Logs
        if: always()
        run: docker logs fortress-integration 2>&1 || true

  constrained-soak:
    name: Concurrency And Lifecycle Soak
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: docker build --pull -t cloudbrowser-fortress-integration-soak ./browser-engine
      - name: Start constrained container
        run: |
          docker run -d --name fortress-integration-soak -p 127.0.0.1:8080:8080 \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=256m \
            --tmpfs /home/engine:rw,nosuid,size=64m \
            --tmpfs /data:rw,nosuid,size=64m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=256 --memory=2g --cpus=2 \
            -e ENGINE_API_KEY="$ENGINE_API_KEY" \
            -e CORS_ALLOWLIST="https://allowed.invalid" \
            -e POOL_SIZE=3 -e MAX_SESSIONS=10 -e WARM_POOL_INSTANCE_BUDGET=4 \
            -e DEFAULT_TIMEOUT=20000 \
            cloudbrowser-fortress-integration-soak
      - name: Wait for liveness
        run: |
          for i in $(seq 1 60); do curl --silent --fail http://127.0.0.1:8080/liveness >/dev/null && exit 0; sleep 2; done
          docker logs fortress-integration-soak
          exit 1
      - run: node ci/fortress-engine-soak.mjs
      - name: Graceful drain after soak
        run: |
          docker stop -t 10 fortress-integration-soak
          test "$(docker inspect --format '{{.State.ExitCode}}' fortress-integration-soak)" = "0"
      - name: Logs
        if: always()
        run: docker logs fortress-integration-soak 2>&1 || true

  aggregate:
    name: Enterprise Integration Aggregate
    runs-on: ubuntu-latest
    if: always()
    needs: [security-contracts, quality-supply-chain, hardened-smoke, constrained-soak]
    steps:
      - name: Aggregate fail-closed
        id: gate
        run: |
          printf '%s\n' \
            "security=${{ needs.security-contracts.result }}" \
            "quality_supply_chain=${{ needs.quality-supply-chain.result }}" \
            "smoke=${{ needs.hardened-smoke.result }}" \
            "soak=${{ needs.constrained-soak.result }}"
          if [ "${{ needs.security-contracts.result }}" = success ] && \
             [ "${{ needs.quality-supply-chain.result }}" = success ] && \
             [ "${{ needs.hardened-smoke.result }}" = success ] && \
             [ "${{ needs.constrained-soak.result }}" = success ]; then
            echo "overall=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "overall=FAIL" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: fortress/v1.1-enterprise-integration
          fetch-depth: 0
      - name: Persist integration receipt
        run: |
          cat > docs/FORTRESS_ENTERPRISE_INTEGRATION_RECEIPT.md <<EOF_RECEIPT
          # Fortress Enterprise Integration Receipt

          - Tested commit: ${{ github.sha }}
          - Workflow run: ${{ github.run_id }}
          - Security contracts: ${{ needs.security-contracts.result }}
          - Quality and supply chain: ${{ needs.quality-supply-chain.result }}
          - Hardened runtime smoke: ${{ needs.hardened-smoke.result }}
          - Concurrency/lifecycle soak: ${{ needs.constrained-soak.result }}
          - Overall: ${{ steps.gate.outputs.overall }}
          - Chromium sandbox disabled flags: FORBIDDEN
          - DNS-pinned final outbound sockets: REQUIRED
          - Playwright request guard: REQUIRED
          - Service workers: BLOCKED
          - Warm pool target idle: 3
          - Browser launch concurrency: 1
          - PID limit under test: 256
          - Network-layer destination firewall: NOT VERIFIED, defense in depth still recommended
          - Base44 Test Data integration: NOT EXECUTED by this workflow
          - Railway staging: NOT EXECUTED by this workflow
          - Production deploy: NOT EXECUTED
          - Main write/merge: NOT EXECUTED
          EOF_RECEIPT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FORTRESS_ENTERPRISE_INTEGRATION_RECEIPT.md
          if ! git diff --cached --quiet; then
            git commit -m "ci: record Fortress enterprise integration receipt"
            git pull --rebase origin fortress/v1.1-enterprise-integration
            git push origin HEAD:fortress/v1.1-enterprise-integration
          fi
      - name: Enforce aggregate
        run: test "${{ steps.gate.outputs.overall }}" = PASS
