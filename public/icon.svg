<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="carbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181d"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="url(#carbon)"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
      <line x1="4" y1="0" x2="4" y2="8" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffae52"/>
      <stop offset="0.5" stop-color="#ff8800"/>
      <stop offset="1" stop-color="#c96708"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="url(#carbon)"/>
  <rect width="512" height="512" rx="96" fill="url(#weave)"/>

  <!-- corner bolts -->
  <g fill="#3a3d44">
    <circle cx="40" cy="40" r="4"/>
    <circle cx="472" cy="40" r="4"/>
    <circle cx="40" cy="472" r="4"/>
    <circle cx="472" cy="472" r="4"/>
  </g>

  <!-- browser window outline -->
  <g filter="url(#glow)">
    <rect x="120" y="150" width="272" height="212" rx="20" ry="20"
          fill="none" stroke="url(#amber)" stroke-width="10"/>
    <!-- top bar -->
    <line x1="120" y1="190" x2="392" y2="190" stroke="url(#amber)" stroke-width="8"/>
    <!-- traffic dots -->
    <circle cx="142" cy="170" r="5" fill="#ff8800"/>
    <circle cx="160" cy="170" r="5" fill="#ff8800" fill-opacity="0.6"/>
    <circle cx="178" cy="170" r="5" fill="#ff8800" fill-opacity="0.3"/>
  </g>

  <!-- cloud + bolt hybrid -->
  <g filter="url(#glow)">
    <!-- cloud shape -->
    <path d="M200 300
             C 200 278, 218 262, 240 262
             C 248 244, 268 232, 290 236
             C 308 218, 338 220, 348 242
             C 366 246, 372 266, 362 282
             C 366 296, 354 308, 338 306
             L 214 306
             C 204 306, 196 296, 200 300 Z"
          fill="url(#amber)" fill-opacity="0.18"
          stroke="url(#amber)" stroke-width="6" stroke-linejoin="round"/>
    <!-- lightning bolt through cloud -->
    <path d="M268 250 L 248 296 L 266 296 L 246 344 L 296 286 L 276 286 L 296 250 Z"
          fill="url(#amber)" stroke="#ffae52" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
